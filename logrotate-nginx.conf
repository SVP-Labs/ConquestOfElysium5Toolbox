# Access and error logs hold visitor IPs; the privacy page promises they are
# gone after 14 days at the latest. Daily rotation with 13 kept rotations
# means no log line outlives that promise.
/var/log/nginx/*.log {
    daily
    rotate 13
    missingok
    notifempty
    create
    sharedscripts
    postrotate
        test -f /var/run/nginx.pid && kill -USR1 "$(cat /var/run/nginx.pid)"
    endscript
}
