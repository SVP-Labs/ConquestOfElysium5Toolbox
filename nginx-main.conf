# Replaces the stock /etc/nginx/nginx.conf. The stock http block defines a
# `main` access_log carrying the full X-Forwarded-For address; because
# access_log directives at the same level accumulate rather than override,
# it kept logging full IPs alongside the anonymised log. Here the http block
# logs nothing, and the single active access_log lives in the server block
# (conf.d/default.conf), using the anonymised format defined below.

user  nginx;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Traefik terminates the connection, so the visitor's real IP arrives in
    # X-Forwarded-For. It is anonymised before anything is written: IPv4
    # loses its last octet, IPv6 keeps only its first three hextets. The
    # regexes must be quoted — nginx reads unquoted braces as block
    # delimiters.
    map $http_x_forwarded_for $anon_ip {
        "~^(\d+\.\d+\.\d+)\.\d+"                                    "$1.0";
        "~^([0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}):"   "$1::";
        default                                                     "0.0.0.0";
    }

    log_format anon '$anon_ip [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

    # No http-level access log — the server block holds the only one.
    access_log off;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
