server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The single active access log — anonymised format, to the container's
    # stdout (Docker/Coolify collect it). The map and log_format live in
    # nginx-main.conf, which replaces the stock /etc/nginx/nginx.conf.
    access_log /dev/stdout anon;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Astro emits hashed filenames under /_astro/, safe to cache hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Pages must revalidate on every visit so deploys reach users
        # immediately; the hashed assets above carry the real caching.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
