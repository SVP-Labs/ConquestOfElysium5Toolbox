# Traefik terminates the connection, so the visitor's real IP arrives in
# X-Forwarded-For. Log it anonymized: IPv4 loses its last octet, IPv6 keeps
# only its first three hextets — the log never holds a full visitor IP.
# The regexes must be quoted: they contain {n,m} repetitions, and nginx's
# config parser reads unquoted braces as block delimiters.
map $http_x_forwarded_for $anon_ip {
    "~^(\d+\.\d+\.\d+)\.\d+"                                    "$1.0";
    "~^([0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}):"   "$1::";
    default                                                     "0.0.0.0";
}

log_format anon '$anon_ip [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';

# Logs go to the container's stdout/stderr (Docker/Coolify collect them).
# Only the anonymized address above is ever written.
error_log  /dev/stderr notice;
access_log /dev/stdout anon;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Astro emits hashed filenames under /_astro/, safe to cache hard.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        # Pages must revalidate on every visit so deploys reach users
        # immediately; the hashed assets above carry the real caching.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }
}
